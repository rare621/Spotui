name: Build and release USpot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uspot-release
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      USPOT_SIGNING_KEYSTORE: ${{ github.workspace }}/uspot-signing.keystore
      USPOT_STORE_PASSWORD: ${{ secrets.USPOT_STORE_PASSWORD }}
      USPOT_KEY_ALIAS: ${{ secrets.USPOT_KEY_ALIAS }}
      USPOT_KEY_PASSWORD: ${{ secrets.USPOT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0"
      - name: Restore existing signing key
        env:
          SIGNING_KEY: ${{ secrets.USPOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          key = os.environ.get('SIGNING_KEY', '').strip()
          if not key:
              raise SystemExit('Restore USPOT_SIGNING_KEYSTORE_BASE64 with the existing signing key. Do not generate a replacement for an update.')
          pathlib.Path(os.environ['USPOT_SIGNING_KEYSTORE']).write_bytes(base64.b64decode(''.join(key.split()), validate=True))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser interactions
        run: npm install --no-audit --no-fund && npm test
        working-directory: webui-tests
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          ./gradlew :app:testDebugUnitTest :spotify:test --no-daemon --max-workers=2
      - name: Verify in-place update identity
        env:
          EXPECTED_CERT: 72feb004ee3aa78eca4b954c6d448b774a41166af77a35b2d4b59cdb9a2752ed
        run: |
          python3 - <<'PYVERIFY'
          import os, pathlib, re, subprocess
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          sig = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', apk], text=True)
          cert = re.search(r'Signer #1 certificate SHA-256 digest: (\w+)', sig).group(1)
          if cert.lower() != os.environ['EXPECTED_CERT'].lower():
              raise SystemExit('Signing certificate differs from the previous public release. Refusing to publish.')
          if 'Verified using v2 scheme (APK Signature Scheme v2): true' not in sig:
              raise SystemExit('APK v2 signature verification failed.')
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', apk], text=True)
          expected_code = re.search(r'versionCode = (\d+)', pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          if "name='com.music.spotui.modified'" not in badging.splitlines()[0] or f"versionCode='{expected_code}'" not in badging.splitlines()[0]:
              raise SystemExit('Wrong package or version. Refusing to publish a separate preview app as an update.')
          print('Production signer, package, version and APK signature verified.')
          PYVERIFY
      - name: Package APK and matching source
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/USpot.apk
          git archive --format=zip --prefix=USpot/ -o release/USpot-source.zip HEAD
          cp LICENSE NOTICE SOURCE.md release/
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName = (?:if \(uspotPreview\) "[^"]+" else )?"([^"]+)"', source).group(1)
          code = re.search(r'versionCode = (\d+)', source).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'USPOT_TAG=v{version}-build-{code}\nUSPOT_TITLE=USpot {version} (build {code})\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: USpot-APK-and-source
          path: release/*
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$USPOT_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$USPOT_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo 'Release already published; increase versionCode for another update.'
              exit 0
            fi
          else
            gh release create "$USPOT_TAG" --draft --target "$(git rev-parse HEAD)" --title "$USPOT_TITLE" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$USPOT_TAG" release/* --clobber
          gh release edit "$USPOT_TAG" --target "$(git rev-parse HEAD)" --title "$USPOT_TITLE" --notes-file RELEASE_NOTES.md --draft=false --latest
